[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "THANNYA"
version = "1.1.0"
description = "a tool for the annotation and identification of orthologous and unique microsatellites in genomes"
requires-python = ">=3.9"
authors = [{name = "Wagner Nunes Ribeiro", email = "wagner2@egresso.ufg.br"}]
dependencies = ["openpyxl>=3.0", "flask>=2.3"]

[project.optional-dependencies]
pdf = ["cairosvg"]
web = ["gunicorn"]

[project.scripts]
thannya = "micromine.cli:main"
thannya-web = "micromine.web.app:main"

[tool.setuptools]
packages = ["thannya", "thannya.web"]

[tool.setuptools.package-data]
"thannya.web" = ["static/*"]
